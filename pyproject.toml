[project]
name = "prodoscore-automation-test"
version = "0.1.0"
description = "Prodoscore automation test suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prodoscore-automation-library",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automation_test"]

[tool.uv.sources]
prodoscore-automation-library = { path = "../prodoscore-automation-library", editable = true }
