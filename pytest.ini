[pytest]
# Pytest configuration
testpaths = automation_test/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    manager_page: Tests for the manager page
    manager_page_filters: Tests for manager page filter functionality
    skip_db_cleanup: Skip database cleanup after test
    order: Control test execution order

# Test output
addopts = 
    -v
    -s
    --html=reports/html/report.html
    --self-contained-html
